<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="A quiet place to write. An open page or a mechanical typewriter. Your words, your own pace." />
    <title>type. — A quiet place to write</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23191919'/%3E%3Ctext x='19' y='47' font-family='Georgia' font-size='50' fill='white'%3Et%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand-group">
          <button class="wordmark" id="home-button" aria-label="type. — focus on your writing">type<span>.</span></button>
          <span class="brand-divider" aria-hidden="true"></span>
          <button class="text-button drafts-toggle" id="drafts-button" aria-haspopup="dialog" aria-expanded="false"><span data-icon="sheets"></span><span>Your pages</span></button>
        </div>
        <div class="header-actions">
          <span class="save-status" id="save-status" role="status"><span data-icon="check"></span><span>Saved on this device</span></span>
          <button class="icon-button" id="sound-button" aria-label="Turn typing sounds on" aria-pressed="false" data-tooltip="Sound off"><span data-icon="soundOff"></span></button>
          <button class="icon-button" id="focus-button" aria-label="Enter focus mode" aria-pressed="false" data-tooltip="Focus · Alt F"><span data-icon="focus"></span></button>
          <button class="icon-button" id="more-button" aria-label="Page options" aria-haspopup="menu" aria-expanded="false" data-tooltip="Page options"><span data-icon="more"></span></button>
        </div>
      </header>

      <main id="writing-room" class="writing-room">
        <div class="room-caption" aria-hidden="true"><span id="room-name">The quiet room</span><span class="caption-dash"></span><span id="room-description">A little space to think.</span></div>
        <div class="retro-ambience" aria-hidden="true"></div>
        <section class="page" id="page" aria-label="Your writing">
          <div class="paper-texture" aria-hidden="true"></div>
          <div class="page-inner">
            <div class="page-heading">
              <h1><input id="page-title" aria-label="Page title" placeholder="Untitled" autocomplete="off" maxlength="160" /></h1>
              <span class="page-date" id="page-date"></span>
            </div>
            <div class="editor-wrap" id="editor-wrap">
              <textarea id="editor" aria-label="Write your thoughts" placeholder="Let your thoughts find their way." spellcheck="true"></textarea>
              <span class="ink-pulse" id="ink-pulse" aria-hidden="true"></span>
            </div>
          </div>
          <span class="paper-end" aria-hidden="true">type.</span>
        </section>
        <div class="machine-stage" id="machine-stage" aria-hidden="true"></div>
        <div class="machine-fallback" id="machine-fallback" hidden aria-label="Typewriter keyboard"><span>type.</span></div>
        <button class="leave-focus text-button" id="leave-focus"><span data-icon="expand"></span>Leave focus<span class="key-hint">esc</span></button>
        <button class="return-key" id="return-key" aria-label="Add a new line"><span data-icon="return"></span><span>Return</span></button>
      </main>

      <footer class="bottom-bar">
        <div class="writing-stats" id="writing-stats" aria-label="Writing statistics"><span id="word-count">0 words</span><span class="stat-dot" aria-hidden="true">·</span><span id="character-count">0 characters</span><span class="stat-dot reading-stat" aria-hidden="true">·</span><span class="reading-stat" id="reading-time">0 min read</span></div>
        <div class="footer-note" id="footer-note">No rush. Just write.</div>
        <button class="theme-button" id="theme-button" aria-haspopup="dialog" aria-expanded="false"><span class="theme-swatch" id="theme-swatch" aria-hidden="true"><span></span></span><span id="theme-label">The quiet room</span><span class="theme-chevron" data-icon="chevron"></span></button>
      </footer>

      <div class="popover options-menu" id="options-menu" role="menu" hidden>
        <button role="menuitem" id="new-page"><span data-icon="plus"></span>New page<span class="menu-shortcut">Alt N</span></button>
        <button role="menuitem" id="export-page"><span data-icon="download"></span>Download .txt<span class="menu-shortcut">⌘ / Ctrl S</span></button>
        <button role="menuitem" id="copy-page"><span data-icon="copy"></span>Copy text</button>
        <button role="menuitem" id="import-page"><span data-icon="upload"></span>Import a text file</button>
        <div class="menu-rule"></div>
        <div class="type-size"><span>Text size</span><div><button id="font-decrease" aria-label="Decrease text size">A−</button><span id="font-size-label">22</span><button id="font-increase" aria-label="Increase text size">A+</button></div></div>
      </div>
      <input type="file" id="file-input" accept=".txt,.md,text/plain,text/markdown" hidden />

      <section class="theme-picker popover" id="theme-picker" role="dialog" aria-labelledby="theme-picker-title" hidden>
        <div class="popover-heading"><h2 id="theme-picker-title">A change of scenery</h2><button class="icon-button" id="close-themes" aria-label="Close themes"><span data-icon="close"></span></button></div>
        <button class="theme-choice" data-theme-choice="quiet" aria-pressed="true">
          <span class="theme-preview preview-quiet" aria-hidden="true"><span class="preview-type">Aa<span class="preview-caret"></span></span><span class="preview-lines"><i></i><i></i><i></i></span></span>
          <span class="choice-description"><strong>The quiet room</strong><span>Nothing between you and your words.</span></span><span class="choice-check" data-icon="check"></span>
        </button>
        <button class="theme-choice" data-theme-choice="atelier" aria-pressed="false">
          <span class="theme-preview preview-atelier" aria-hidden="true"><span class="mini-paper">Dear world,</span><span class="mini-machine"><i></i><i></i><i></i></span></span>
          <span class="choice-description"><strong>The writer’s atelier</strong><span>Old keys. Fresh thoughts.</span></span><span class="choice-check" data-icon="check"></span>
        </button>
        <p class="theme-footnote">Same words. A different feeling.</p>
      </section>

      <div class="drawer-shade" id="drawer-shade" hidden></div>
      <aside class="drafts-drawer" id="drafts-drawer" role="dialog" aria-modal="true" aria-labelledby="drafts-title" hidden>
        <div class="drawer-header"><h2 id="drafts-title">Your pages</h2><button class="icon-button" id="close-drafts" aria-label="Close your pages"><span data-icon="close"></span></button></div>
        <button class="new-page-button" id="drawer-new-page"><span data-icon="plus"></span>A new beginning</button>
        <div id="draft-list" class="draft-list"></div>
        <p class="drawer-note"><span data-icon="device"></span>Your words stay in this browser.<br />Download a copy to keep them safe.</p>
      </aside>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <noscript><p class="noscript">Please enable JavaScript to save your writing and switch rooms.</p></noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
